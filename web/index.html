<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Ortak</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d4825f'/%3E%3Ccircle cx='12' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Ccircle cx='20' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3C/svg%3E">
<script>
  try {
    var t = JSON.parse(localStorage.getItem('ortak.theme') || 'null');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* storage unavailable */ }
</script>
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Kenar çubuğu">
    <div class="sb-head">
      <a class="brand" href="#/" title="Ortak — yeni çalışma">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span class="brand-name">Ortak</span>
      </a>
      <button type="button" class="icon-btn sb-close" id="sb-close" title="Kenar çubuğunu kapat" aria-label="Kenar çubuğunu kapat"></button>
    </div>

    <div class="surface-switch" id="surface-switch" role="tablist" aria-label="Arayüz"></div>

    <div class="sb-project">
      <label class="sb-label" for="cwd">Proje klasörü</label>
      <div class="cwd-row">
        <div class="cwd-wrap">
          <input id="cwd" class="input" type="text" spellcheck="false" autocomplete="off" placeholder="C:\projeler\uygulama">
          <div class="cwd-menu" id="cwd-menu" hidden></div>
        </div>
        <button type="button" class="icon-btn cwd-browse" id="cwd-browse" title="Klasöre gözat" aria-label="Klasöre gözat"></button>
      </div>
      <div class="cwd-status" id="cwd-status" aria-live="polite"></div>
    </div>

    <button type="button" class="btn btn-primary new-btn" id="new-btn"></button>

    <div class="sb-title" id="sb-runs-title">Geçmiş</div>
    <nav class="runs" id="runs" aria-label="Çalışma geçmişi"></nav>

    <section class="agents-panel" id="agents-panel">
      <div class="ap-head">
        <button type="button" class="ap-toggle" id="ap-toggle" aria-expanded="true" aria-controls="ap-body">
          <span class="ap-chev" id="ap-chev"></span>Ajanlar <span class="ap-count" id="ap-count"></span>
        </button>
        <button type="button" class="icon-btn" id="ap-refresh" title="Ajanları ve limitleri yenile" aria-label="Ajanları ve limitleri yenile"></button>
      </div>
      <div class="ap-body" id="ap-body"></div>
    </section>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <main class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="menu-btn" title="Menü" aria-label="Menüyü aç"></button>
      <div class="tb-title" id="tb-title"></div>
      <div class="tb-actions" id="tb-actions"></div>
      <button type="button" class="icon-btn" id="perf-btn" title="Performans ayarları" aria-label="Performans ayarları"></button>
      <button type="button" class="icon-btn" id="theme-btn" title="Temayı değiştir" aria-label="Temayı değiştir"></button>
    </header>

    <div class="content" id="content"></div>

    <div class="composer-wrap">
      <form class="composer" id="composer" autocomplete="off">
        <div class="attach-list" id="attach-list" hidden></div>
        <textarea id="prompt" rows="1" aria-label="Mesaj"></textarea>
        <div class="composer-bar">
          <button type="button" class="icon-btn attach-btn" id="attach-btn" title="Dosya veya resim ekle (sürükleyip bırakabilir ya da yapıştırabilirsiniz)" aria-label="Dosya veya resim ekle"></button>
          <input type="file" id="attach-input" multiple hidden>
          <div class="composer-ctx" id="composer-ctx"></div>
          <span class="composer-hint">Enter gönder · Shift+Enter yeni satır</span>
          <button type="submit" class="send-btn" id="send-btn" title="Gönder (Enter)" aria-label="Gönder"></button>
        </div>
      </form>
    </div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:2rem;font-family:sans-serif">Ortak için JavaScript gerekir.</p></noscript>
</body>
</html>
