<rect x="38" y="0" width="518.155" height="38" rx="12" fill="#161b22" stroke="#4f8df9" stroke-opacity=".45"/>
<text x="55" y="24" font-size="14.5">Arada bir yol: SQLite + Drizzle ORM. Postgres’e geçiş tek ayar.</text></g></g><g transform="translate(32 278)"><g class="k7"><circle cx="16" cy="19" r="13" fill="#d97757"/><text x="16" y="23.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">C</text>
