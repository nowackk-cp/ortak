<style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,'Cascadia Code',Consolas,'SF Mono',Menlo,monospace}.muted{fill:#8b949e}
