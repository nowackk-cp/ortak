<text x="18" y="24.5" font-size="15">Yerel bir not uygulaması yapıyorum: SQLite mı, Postgres mi?</text></g></g><g transform="translate(32 116)"><g class="k1"><circle cx="16" cy="19" r="13" fill="#d97757"/><text x="16" y="23.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">C</text>
